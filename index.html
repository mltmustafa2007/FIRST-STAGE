<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>جدول المرحلة الأولى</title>
<meta name="theme-color" content="#1b1a6e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="جدول المرحلة">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: شريط علوي مضغوط، اختيار الكروب ثم اليوم، بطاقات محاضرات بكتلة وقت ملونة، تنقل سفلي ثابت بين الجدول والملخصات */
:root{
  --bg:#eff4f4; --surface:#ffffff; --surface2:#e3ecee; --ink:#10242c; --muted:#58707a; --line:#d1dedf;
  --brand:#12353f; --brand-ink:#eaf5f6;
  --th:#0b6b66; --th-soft:#d5efec; --pr:#a4490e; --pr-soft:#fbe6cf; --on-th:#ffffff;
  --bad:#b3261e; --focus:#1f6feb;
  --font-body:'IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
  --font-display:'Readex Pro','IBM Plex Sans Arabic',Tahoma,system-ui,sans-serif;
  --r:14px; color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c181d; --surface:#13252c; --surface2:#1c343d; --ink:#e5f0f2; --muted:#92aab2; --line:#26424b;
    --brand:#16363f; --brand-ink:#eaf5f6;
    --th:#5fd6c9; --th-soft:#123a3a; --pr:#f0a863; --pr-soft:#3b2813; --on-th:#06201e;
    --bad:#ff8f86; --focus:#7ab2ff; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c181d; --surface:#13252c; --surface2:#1c343d; --ink:#e5f0f2; --muted:#92aab2; --line:#26424b;
  --brand:#16363f; --brand-ink:#eaf5f6;
  --th:#5fd6c9; --th-soft:#123a3a; --pr:#f0a863; --pr-soft:#3b2813; --on-th:#06201e;
  --bad:#ff8f86; --focus:#7ab2ff; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.65;direction:rtl}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{background:var(--brand);color:var(--brand-ink);margin-top:calc(-1 * env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.brand svg{flex:none}
.bt{min-width:0}
.bt h1{font-family:var(--font-display);font-size:20px;line-height:1.25;margin:0;font-weight:700;text-wrap:balance}
.bt p{margin:2px 0 0;font-size:12.5px;opacity:.82}
.main{padding-block:18px 150px}
.sec{display:flex;flex-direction:column;gap:14px}
.lbl{font-family:var(--font-display);font-size:13px;letter-spacing:.04em;color:var(--muted);margin:6px 0 0;font-weight:600}
.dayh{font-family:var(--font-display);font-size:18px;margin:8px 0 0;font-weight:600}
.subt{font-family:var(--font-display);font-size:22px;margin:0;line-height:1.3;text-wrap:balance}
.hint,.note{color:var(--muted);margin:0;font-size:14px}
.err{color:var(--bad);margin:0;font-size:14px;font-weight:600}
.en{color:var(--muted);font-size:13px;text-align:right}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.chip{min-height:46px;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:600;cursor:pointer;padding:4px 8px}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.wide{width:100%;margin-top:8px}
.chip.day{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.3;min-height:58px}
.chip.day small{font-size:11.5px;font-weight:500;opacity:.8}
.chip.day.dim{opacity:.55}
.chip.day.on.dim{opacity:1}
.td{position:absolute;top:-8px;inset-inline-start:8px;background:var(--th);color:var(--on-th);font-size:10.5px;font-weight:700;border-radius:999px;padding:0 7px;line-height:18px}
.list{display:flex;flex-direction:column;gap:10px}
.sess{display:grid;grid-template-columns:92px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.tm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:12px 6px;text-align:center}
.sess.theory .tm{background:var(--th-soft);color:var(--th)}
.sess.practical .tm{background:var(--pr-soft);color:var(--pr)}
.tm b{font-family:var(--font-display);font-size:21px;line-height:1.1;font-variant-numeric:tabular-nums}
.tm .to{font-size:12px;font-variant-numeric:tabular-nums}
.tm .dur{font-size:12px;font-weight:700;margin-top:6px}
.bd{padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ttl{font-size:16.5px;font-weight:700;line-height:1.35}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;font-size:14px;color:var(--muted)}
.grp{font-size:13px;color:var(--muted)}
.pill{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:700}
.pill.theory{background:var(--th-soft);color:var(--th)}
.pill.practical{background:var(--pr-soft);color:var(--pr)}
.gap{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12.5px}
.gap::before,.gap::after{content:"";flex:1;border-top:1px dashed var(--line)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{margin:0}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.small{min-height:40px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--th);color:var(--on-th);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.55;cursor:default}
.adm{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.4);flex:none}
.row{display:flex;flex-wrap:wrap;gap:8px}
.subj{display:flex;flex-direction:column;gap:8px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;width:100%}
.sn{display:flex;flex-direction:column;gap:0}
.sn b{font-size:17px}
.sn span{font-size:13px;color:var(--muted);text-align:right}
.sb{display:flex;flex-wrap:wrap;gap:8px}
.back{align-self:flex-start}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface2);border-radius:12px;padding:4px;gap:4px}
.segb{min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:600;cursor:pointer}
.segb.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.file{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.ext{height:52px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;letter-spacing:.04em}
.ext.theory{background:var(--th-soft);color:var(--th)}
.ext.practical{background:var(--pr-soft);color:var(--pr)}
.fb{min-width:0;display:flex;flex-direction:column;gap:4px}
.ft{font-weight:700;line-height:1.4;overflow-wrap:anywhere}
.fm{font-size:13px;color:var(--muted)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:env(safe-area-inset-bottom,0px)}
.navin{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding-block:6px}
.nb{height:54px;min-width:0;border:0;background:transparent;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;color:var(--muted);cursor:pointer}
.nb.on{background:var(--th-soft);color:var(--th)}
.dbar{position:fixed;left:0;right:0;bottom:calc(67px + env(safe-area-inset-bottom,0px));z-index:19;background:var(--brand);color:var(--brand-ink);padding-top:10px;padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.dbar .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dbar span{flex:1 1 140px;font-size:14px;font-weight:600}
.dbar .btn{background:transparent;color:var(--brand-ink);border-color:rgba(255,255,255,.4)}
.dbar .btn.primary{background:var(--th);color:var(--on-th);border-color:transparent}
.banner{background:var(--pr-soft);color:var(--pr);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:8px;margin-bottom:14px;font-weight:600}
.sbg{position:fixed;inset:0;z-index:50;background:rgba(5,15,18,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--surface);border-radius:18px 18px 0 0;padding-top:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sh-h h2{margin:0;font-family:var(--font-display);font-size:19px}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>span{font-size:13px;font-weight:600;color:var(--muted)}
input[type=text],input[type=time],input[type=password],select{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.srow{display:flex;flex-direction:column;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px}
.chk{display:flex;align-items:center;gap:8px;font-weight:600}
.chk input{width:20px;height:20px}
.warn{color:var(--pr);font-size:13.5px;margin:0;font-weight:600}
.vh{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}
.upl{position:relative;cursor:pointer}
.pv{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column}
.pvh{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line);padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.pvt{flex:1;min-width:0;text-align:center;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pvbody{flex:1;overflow:auto;padding-top:12px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
.pg{background:#fff;margin:0 auto 12px;max-width:900px;width:100%;box-shadow:0 1px 5px rgba(0,0,0,.3)}
.pg canvas{display:block;width:100%;height:auto}
.pvimg{display:block;max-width:100%;margin:0 auto;border-radius:8px}
.pvtxt{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;font-family:var(--font-body);direction:auto;margin:0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;max-width:min(92%,520px);text-align:center;box-shadow:0 4px 18px rgba(0,0,0,.3)}
.hero{position:relative;overflow:hidden;background:var(--th-soft);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px;background-image:radial-gradient(circle at 6% 118%,color-mix(in srgb,var(--th) 16%,transparent) 0 92px,transparent 93px),radial-gradient(circle at 98% -12%,color-mix(in srgb,var(--th) 12%,transparent) 0 74px,transparent 75px)}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.hdate{font-size:13px;font-weight:600;color:var(--th)}
.gbtn{border:1px solid color-mix(in srgb,var(--th) 40%,transparent);background:var(--surface);color:var(--th);border-radius:999px;min-height:36px;padding:0 14px;font-weight:700;cursor:pointer}
.greet{font-family:var(--font-display);font-size:28px;line-height:1.2;margin:0;font-weight:700}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 6px 18px -10px rgba(10,40,45,.35)}
.nl{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.nlab{font-size:12.5px;font-weight:700;color:var(--muted);letter-spacing:.03em}
.when{font-size:13px;font-weight:700;color:var(--th);background:var(--th-soft);border-radius:999px;padding:1px 12px}
.when.live{background:var(--th);color:var(--on-th)}
.ncard.practical .when:not(.live){color:var(--pr);background:var(--pr-soft)}
.nt{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1.35}
.ntime{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center;display:flex;flex-direction:column}
.stat b{font-family:var(--font-display);font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.minis{display:flex;flex-direction:column;gap:8px}
.mini{display:grid;grid-template-columns:62px minmax(0,1fr) auto;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini .mt{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;font-size:17px}
.mini.theory .mt{color:var(--th)}
.mini.practical .mt{color:var(--pr)}
.mini .mb{display:flex;flex-direction:column;min-width:0}
.mini .mb b{font-size:15px;line-height:1.4}
.mini .mb span{font-size:12.5px;color:var(--muted)}
.mini.live,.sess.live{border-color:var(--th);box-shadow:0 0 0 2px var(--th-soft)}
.pill.now{background:var(--th);color:var(--on-th)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;cursor:pointer;min-width:0}
.tile svg{color:var(--th);margin-bottom:6px}
.tile b{font-size:16px}
.tile span{font-size:13px;color:var(--muted)}
.foot{text-align:center;color:var(--muted);font-size:12.5px;margin:6px 0 0}
.qcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px 16px 14px;display:flex;flex-direction:column;align-items:flex-start;gap:10px;overflow:hidden}
.qmark{position:absolute;inset-inline-end:14px;top:-6px;font-family:var(--font-display);font-size:84px;line-height:1;color:var(--th-soft)}
.qtext{position:relative;margin:0;font-family:var(--font-display);font-size:19px;line-height:1.7;font-weight:500;text-wrap:balance;padding-inline-end:28px}
.qlist{display:flex;flex-direction:column;gap:8px}
.qitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;line-height:1.7}
.mline{margin:0;padding:8px 12px;border-radius:12px;background:var(--th-soft);color:var(--th);font-weight:600;font-size:14px}
.credit{display:flex;align-items:center;gap:12px;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:12px 14px;text-decoration:none}
.credit .cr{display:flex;flex-direction:column;flex:1;min-width:0;line-height:1.3}
.credit .cr small{font-size:12px;opacity:.8}
.credit .cr b{font-family:var(--font-display);font-size:17px}
.credit .cu{font-weight:700;font-size:14px;background:rgba(255,255,255,.14);border-radius:999px;padding:3px 12px}
.splash{position:fixed;inset:0;z-index:90;background:var(--brand);color:var(--brand-ink);overflow:auto;display:flex;align-items:center;justify-content:center;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.spin{width:100%;max-width:460px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:14px}
.slogo{width:84px;height:84px;border-radius:24px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center}
.slogo svg{width:46px;height:46px}
.spin h1{font-family:var(--font-display);font-size:38px;line-height:1.2;margin:0}
.ssub{margin:0;opacity:.85;font-size:14.5px}
.sq{font-family:var(--font-display);font-size:20px;line-height:1.7;background:rgba(255,255,255,.1);border-radius:18px;padding:16px;text-wrap:balance}
.btn.big{min-height:52px;width:100%;font-size:17px}
.spin .credit{width:100%;background:rgba(255,255,255,.12)}
@media (prefers-reduced-motion:no-preference){.spin{animation:rise .5s ease-out both}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}}
@media (prefers-reduced-motion:no-preference){.sess,.file,.subj{transition:box-shadow .15s}}

/* ===== مظهر محدّث ===== */
:root{
  --bg:#eef3f6; --surface:#ffffff; --surface2:#e2eaef; --ink:#0b1f2a; --muted:#566d7b; --line:#d8e3ea;
  --g1:#0b3f52; --g2:#0e7c86; --brand:#0b3f52;
  --th:#0a7a73; --th-soft:#d6f1ee; --pr:#b4510c; --pr-soft:#fde9d3;
  --r:20px; --sat:62%; --lig:34%;
  --sh:0 1px 2px rgba(9,36,48,.06),0 10px 28px -14px rgba(9,36,48,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071218; --surface:#0f2129; --surface2:#172e38; --ink:#e6f1f4; --muted:#8fa7b2; --line:#21404b;
    --g1:#0a2e3b; --g2:#0d5c66; --brand:#0a2e3b;
    --th:#5eead4; --th-soft:#0f3a3a; --pr:#fbb36a; --pr-soft:#3a2711; --sat:68%; --lig:70%;
    --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#071218; --surface:#0f2129; --surface2:#172e38; --ink:#e6f1f4; --muted:#8fa7b2; --line:#21404b;
  --g1:#0a2e3b; --g2:#0d5c66; --brand:#0a2e3b;
  --th:#5eead4; --th-soft:#0f3a3a; --pr:#fbb36a; --pr-soft:#3a2711; --sat:68%; --lig:70%;
  --sh:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
.top{background:linear-gradient(135deg,var(--g1),var(--g2));border-radius:0 0 28px 28px;box-shadow:0 12px 30px -20px rgba(8,50,64,.9)}
.top .wrap{padding-block:16px 22px}

function durLabel(d){
  if(d<=0) return '';
  const hr=Math.floor(d/60), r=d%60;
  if(!hr) return r===30?'نص ساعة':r+' دقيقة';
  let a=hr===1?'ساعة':hr===2?'ساعتين':hr<=10?hr+' ساعات':hr+' ساعة';
  if(!r) return a;
  return r===30?a+' ونص':a+' و'+r+' دقيقة';
}

function covers(s){

function sessionsFor(day,g){
  return state.sessions
    .filter(s=>s.day===day&&(g==='*'||covers(s).indexOf(g)>=0))

}
function defaultDay(){

  for(let i=0;i<DAYS.length;i++){

    if(state.sessions.some(s=>s.day===d.k)) return d.k;

}

let toastEl=null,toastT=0;
function toast(msg,ms){
  if(toastEl) toastEl.remove();
  clearTimeout(toastT);
  toastEl=h('div',{class:'toast',role:'status'},msg);
  DOC.body.append(toastEl);
  if(ms!==0) toastT=setTimeout(()=>{if(toastEl){toastEl.remove();toastEl=null;}},ms||2800);

/* ---------- الرئيسية ---------- */
function nowMin(){const d=new Date();return d.getHours()*60+d.getMinutes();}
function todayKey(){const d=DAYS.find(x=>x.js===new Date().getDay());return d?d.k:'';}
function isLive(s){const n=nowMin();return s.day===todayKey()&&mins(s.start)<=n&&n<mins(s.end);}
function nextSession(g){
  const now=nowMin(), t0=Math.max(0,DAYS.findIndex(d=>d.js===new Date().getDay()));
  for(let off=0;off<7;off++){
    const d=DAYS[(t0+off)%7];
    let list=sessionsFor(d.k,g);
    if(off===0) list=list.filter(s=>mins(s.end)>now);
    if(list.length) return {s:list[0],off:off,day:d};
  }
  return null;
}
function whenOf(n){
  const now=nowMin(), s=n.s;
  if(n.off===0){
    if(mins(s.start)<=now) return {txt:'جارية الآن · تنتهي '+fmt(mins(s.end)),live:true};
    return {txt:'تبدأ بعد '+durLabel(mins(s.start)-now),live:false};
  }
  if(n.off===1) return {txt:'غداً '+n.day.ar,live:false};
  return {txt:'يوم '+n.day.ar,live:false};
}
function nextCard(g){

const blobCache=new Map();
async function getBlob(f){
  if(blobCache.has(f.assetId)) return blobCache.get(f.assetId);
  const r=await fetch(fileUrl(f));
  if(!r.ok) throw new Error('http '+r.status);
  const b=await r.blob();
  blobCache.set(f.assetId,b);
  return b;
}
const PDFJS='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174';
let pdfP=null;
function loadPdfjs(){
  if(pdfP) return pdfP;
  pdfP=new Promise((res,rej)=>{
    const s=DOC.createElement('script');
    s.src=PDFJS+'/pdf.min.js';
    s.onload=()=>{try{window.pdfjsLib.GlobalWorkerOptions.workerSrc=PDFJS+'/pdf.worker.min.js';res(window.pdfjsLib);}catch(e){rej(e);}};
    s.onerror=()=>{pdfP=null;rej(new Error('pdfjs'));};
    DOC.head.append(s);
  });
  return pdfP;
}
let pvToken=0,pvEl=null;
async function renderPdf(container,buf,token){
  const lib=await loadPdfjs();
  const pdf=await lib.getDocument({data:new Uint8Array(buf)}).promise;
  const p1=await pdf.getPage(1), v1=p1.getViewport({scale:1});
  const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting){io.unobserve(e.target);draw(e.target);}});},{rootMargin:'700px 0px'});
  async function draw(box){
    if(token!==pvToken) return;
    try{
      const page=await pdf.getPage(+box.dataset.n);
      const base=page.getViewport({scale:1});
      const w=box.getBoundingClientRect().width||container.clientWidth;
      const dpr=Math.min(window.devicePixelRatio||1,2);
      const vp=page.getViewport({scale:(w/base.width)*dpr});
      const cv=DOC.createElement('canvas');
      cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);
      box.append(cv);box.style.aspectRatio='auto';
      await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;
    }catch(e){}
  }
  for(let i=1;i<=pdf.numPages;i++){
    const box=h('div',{class:'pg','data-n':i});
    box.style.aspectRatio=v1.width+' / '+v1.height;
    container.append(box);io.observe(box);
  }
}
function closePreview(){
  pvToken++;
  if(pvEl){pvEl.remove();pvEl=null;}
  if(!DOC.querySelector('.sbg')) DOC.body.style.overflow='';
}
function openPreview(f){
  closePreview();
  const token=++pvToken;
  const body=h('div',{class:'pvbody'},h('p',{class:'hint'},'جاري التحميل...'));
  pvEl=h('div',{class:'pv',role:'dialog','aria-modal':'true'},
    h('header',{class:'pvh'},
      h('button',{class:'btn small',type:'button',onclick:closePreview},'إغلاق'),
      h('div',{class:'pvt'},f.title),
      h('button',{class:'btn small primary',type:'button',onclick:()=>download(f)},'تنزيل')),
    body);
  DOC.body.append(pvEl);DOC.body.style.overflow='hidden';
  (async()=>{
    try{
      if(f.ct==='application/pdf'){
        const b=await getBlob(f), buf=await b.arrayBuffer();
        if(token!==pvToken) return;
        body.replaceChildren();
        await renderPdf(body,buf,token);
      }else if(f.ct.indexOf('image/')===0){
        body.replaceChildren(h('img',{class:'pvimg',src:fileUrl(f),alt:f.title}));
      }else{
        const t=await (await getBlob(f)).text();
        if(token!==pvToken) return;
        body.replaceChildren(h('pre',{class:'pvtxt'},t));
      }
    }catch(e){
      if(token!==pvToken) return;
      body.replaceChildren(h('div',{class:'empty'},h('p',null,'تعذرت المعاينة على هذا الجهاز.'),
        h('a',{class:'btn',href:fileUrl(f),target:'_blank',rel:'noopener'},'فتح الملف في تبويب جديد')));
    }
  })();
}
async function download(f){
  const name=(f.title.replace(/[\\\/:*?"<>|]+/g,' ').trim().slice(0,100)||'ملخص')+'.'+extOf(f);
  try{
    const b=await getBlob(f), u=URL.createObjectURL(b);

    setTimeout(()=>URL.revokeObjectURL(u),8000);
    toast('جاري التنزيل...');

      cf.length?h('div',null,cf.map(o=>h('p',{class:'warn'},'يتعارض مع '+((subj(o.sub)||{}).ar||'محاضرة')+' ('+KIND[o.kind]+') '+fmt(mins(o.start))+' - '+fmt(mins(o.end))))):null,
      err?h('p',{class:'err'},err):null,
      h('div',{class:'row'},
        h('button',{class:'btn primary',type:'button',onclick:()=>{
          if(!d.sub){err='اختر المادة.';api.render();return;}
          if(!d.groups.length){err='اختر الكروب أو الشعبة.';api.render();return;}
          if(mins(d.end)<=mins(d.start)){err='وقت النهاية لازم يكون بعد البداية.';api.render();return;}
          d.lecturer=d.lecturer.trim();d.hall=d.hall.trim();
          const i=state.sessions.findIndex(s=>s.id===d.id);
          if(i>=0) state.sessions[i]=d;else state.sessions.push(d);
          api.close();afterChange('تم الحفظ. اضغط «نشر للطلاب» حتى يظهر عندهم.');
        }},'حفظ'),
        orig?h('button',{class:'btn danger',type:'button',onclick:()=>{
          if(!armDel){armDel=true;api.render();return;}
          state.sessions=state.sessions.filter(s=>s.id!==d.id);
          api.close();afterChange('تم حذف المحاضرة.');
        }},armDel?'تأكيد الحذف':'حذف'):null)
    ];
  });
}
function editFile(id){
  const f=state.files.find(x=>x.id===id);
  if(!f) return;
  const d={title:f.title,kind:f.kind};
  let armDel=false;
  openSheet('تعديل ملخص',api=>{
    const sb=subj(f.sub);
    return [
      field('اسم الملخص',h('input',{type:'text',value:d.title,oninput:e=>{d.title=e.target.value;}})),
      sb&&sb.practical?h('div',{class:'fld'},h('span',null,'النوع'),h('div',{class:'seg'},['theory','practical'].map(k=>
        h('button',{class:'segb'+(d.kind===k?' on':''),type:'button',onclick:()=>{d.kind=k;api.render();}},KIND[k])))):null,
      h('div',{class:'row'},
        h('button',{class:'btn primary',type:'button',onclick:()=>{
          f.title=d.title.trim()||f.title;f.kind=d.kind;
          api.close();afterChange('تم الحفظ. اضغط «نشر للطلاب» حتى يظهر عندهم.');
        }},'حفظ'),
        h('button',{class:'btn danger',type:'button',onclick:()=>{
          if(!armDel){armDel=true;api.render();return;}
          state.files=state.files.filter(x=>x.id!==f.id);
          api.close();afterChange('تم حذف الملخص من القائمة.');
        }},armDel?'تأكيد الحذف':'حذف'))
    ];
  });
}
function editSubjects(){
  let msg='',arm='';
  const usedAny=id=>state.sessions.some(s=>s.sub===id)||state.files.some(f=>f.sub===id);
  const usedPr=id=>state.sessions.some(s=>s.sub===id&&s.kind==='practical')||state.files.some(f=>f.sub===id&&f.kind==='practical');
  openSheet('إدارة المواد',api=>{
    const rows=state.subjects.map((sb,i)=>h('div',{class:'srow'},
      h('input',{type:'text',value:sb.ar,'aria-label':'اسم المادة بالعربي',oninput:e=>{sb.ar=e.target.value;}}),
      h('input',{type:'text',dir:'ltr',value:sb.en||'','aria-label':'اسم المادة بالإنكليزي',oninput:e=>{sb.en=e.target.value;}}),
      h('label',{class:'chk'},h('input',{type:'checkbox',checked:!!sb.practical,onchange:e=>{
        if(!e.target.checked&&usedPr(sb.id)){msg='لهذه المادة محاضرات أو ملخصات عملية. احذفها أولاً.';api.render();return;}
        sb.practical=e.target.checked;msg='';}}),'فيها جزء عملي'),
      h('button',{class:'btn small danger',type:'button',onclick:()=>{
        if(usedAny(sb.id)){msg='لهذه المادة محاضرات أو ملخصات. احذفها أولاً.';api.render();return;}
        if(arm!==sb.id){arm=sb.id;msg='';api.render();return;}
        state.subjects.splice(i,1);arm='';api.render();
      }},arm===sb.id?'تأكيد الحذف':'حذف المادة')));
    return [
      msg?h('p',{class:'err'},msg):null,
      rows,
      h('button',{class:'btn',type:'button',onclick:()=>{state.subjects.push({id:'s'+uid(),ar:'مادة جديدة',en:'',practical:false});api.render();}},'+ إضافة مادة'),
      h('button',{class:'btn primary',type:'button',onclick:api.close},'تم')
    ];
  },()=>afterChange());
}

/* ---------- Supabase ---------- */
const CFG=window.SQ_CONFIG||{};
const BUCKET='summaries';
const configured=!!(CFG.SUPABASE_URL&&CFG.SUPABASE_ANON_KEY&&CFG.SUPABASE_URL.indexOf('YOUR-')<0);
const sb=(configured&&window.supabase)?window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY):null;
function fileUrl(f){return String(CFG.SUPABASE_URL||'').replace(/\/$/,'')+'/storage/v1/object/public/'+BUCKET+'/'+encodeURIComponent(f.assetId);}
async function loadRemote(){
  if(!sb) return;
  try{
    const r=await sb.from('site_state').select('data').eq('id',1).maybeSingle();
    if(r.error) throw r.error;
    const d=r.data&&r.data.data;
    if(d&&d.sessions){
      state.subjects=d.subjects||[];state.sessions=d.sessions;state.files=d.files||[];
      initial=JSON.stringify(state);ui.day=defaultDay();
    }
  }catch(e){toast('تعذر تحميل آخر نسخة من الجدول. المعروض نسخة احتياطية.',5000);}
}
async function refreshAuth(){
  if(!sb) return;
  try{
    const r=await sb.auth.getSession();
    ui.isAdmin=!!(r.data&&r.data.session);
  }catch(e){ui.isAdmin=false;}
  ui.admin=ui.isAdmin;
  if(ui.isAdmin&&!ui.group) ui.group='*';
}
function loginSheet(){
  let email='',pass='',err='',busy=false;
  openSheet('دخول المشرف',api=>[
    sb?null:h('p',{class:'err'},'الموقع غير مربوط بـ Supabase بعد. اتبع خطوات الملف README.'),
    field('الإيميل',h('input',{type:'text',dir:'ltr',autocomplete:'username',placeholder:'اكتب إيميل المشرف',value:email,oninput:e=>{email=e.target.value;}})),
    field('الرمز',h('input',{type:'password',dir:'ltr',autocomplete:'current-password',value:pass,oninput:e=>{pass=e.target.value;}})),
    err?h('p',{class:'err'},err):null,
    h('button',{class:'btn primary',type:'button',disabled:busy||!sb,onclick:async()=>{
      busy=true;err='';api.render();
      const r=await sb.auth.signInWithPassword({email:email.trim(),password:pass});
      busy=false;
      if(r.error){err='الإيميل أو الرمز غير صحيح.';api.render();return;}
      await refreshAuth();
      if(!ui.isAdmin){await sb.auth.signOut();err='هذا الحساب ليس حساب المشرف.';api.render();return;}
      api.close();render();toast('أهلاً بك');
    }},busy?'جاري الدخول...':'دخول')
  ]);
}
async function logout(){
  if(sb) await sb.auth.signOut();
  ui.isAdmin=false;ui.admin=false;ui.dirty=false;
  discard();
}

async function uploadFiles(list,sub,kind){
  const arr=Array.from(list||[]);
  if(!arr.length) return;
  if(!sb||!ui.isAdmin){toast('سجّل دخول المشرف أولاً.',4000);return;}
  let ok=0;
  for(let i=0;i<arr.length;i++){
    const f=arr[i];
    const ext=(f.name.split('.').pop()||'').toLowerCase();
    const ct=TYPES[ext];
    if(!ct){toast('«'+f.name+'» صيغته غير مدعومة. حوّله إلى PDF ثم ارفعه.',5000);continue;}
    if(f.size>20*1048576){toast('«'+f.name+'» أكبر من 20 ميغا.',4000);continue;}
    toast('جاري رفع '+(i+1)+' من '+arr.length+'...',0);
    try{
      const path=uid()+'.'+ext;
      const r=await sb.storage.from(BUCKET).upload(path,f,{contentType:ct,upsert:false});
      if(r.error) throw r.error;
      state.files.push({id:uid(),sub:sub,kind:kind,title:f.name.replace(/\.[^.]+$/,''),assetId:path,ct:ct,size:f.size,at:new Date().toISOString()});
      ok++;
    }catch(e){toast('فشل رفع «'+f.name+'».',4000);}
  }
  if(ok) afterChange('تم رفع '+ok+' ملف. اضغط «نشر للطلاب» حتى يظهر عندهم.');
}
async function publishAll(){
  if(!sb||ui.busy) return;
  ui.busy=true;render();
  try{
    const payload={subjects:state.subjects,sessions:state.sessions,files:state.files};
    const r=await sb.from('site_state').upsert({id:1,data:payload,updated_at:new Date().toISOString()});
    if(r.error) throw r.error;
    initial=JSON.stringify(state);ui.dirty=false;ui.busy=false;render();
    toast('تم النشر. التعديلات ظهرت عند الطلاب.',4000);
  }catch(e){
    ui.busy=false;render();
    toast('تعذر النشر. تأكد أنك داخل بحساب المشرف وجرّب مرة ثانية.',5000);
  }
}
